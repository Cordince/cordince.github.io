<script>
  window.addEventListener('scroll', () => {
    const navbar = document.getElementById('topNavBar');
    // If the classList for the navbar is empty, exit the function. 
    // This is to prevent the navbar from appearing when it is not supposed to.
    if (!navbar || !navbar.classList) {
      return;
    }
    if (window.scrollY > 0) {
      navbar.classList.add('d-none');
    } else {
      navbar.classList.remove('d-none');
      navbar.classList.add('d-block');
    }
  });
</script>


<script>
  window.onscroll = function() {

     // Only proceed if the topNavBar is not visible 
      function isNavbarVisible() {
        var navbar = document.getElementById('mobileNavBar');
        if (navbar) {
          var style = window.getComputedStyle(navbar);
          return style.display !== 'none' && style.visibility !== 'hidden' && navbar.offsetHeight > 0;
        } else {
          return false; // The navbar does not exist in the DOM
        }
      }

      if (isNavbarVisible()){
        return;
      }

      var currentScrollPos = window.pageYOffset;
      var navbar = document.getElementById("main-navbar");

      if (currentScrollPos > window.innerHeight-150) { // Adjust the value according to your needs
          navbar.style.display = "block";
      } else {
          navbar.style.display = "none";
      }
  };
</script>
